ss="card" style="margin-top:16px"><div class="splithead"><h2 class="sectiontitle">Resumo das faturas</h2><button class="btn secondary smallbtn" data-action="snapshot">Atualizar valores das faturas</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Cartão</th><th>Total da fatura</th><th>Gastos de terceiros</th><th>Seus gastos pessoais</th><th>Informação da fatura</th></tr></thead><tbody>${state.cards.map(c=>{const x=invoice(c.id,editingMonth);const informed=snapshot(c.id,editingMonth)!=null;return`<tr><td>${esc(c.name)}</td><td>${fmt(x.total)}</td><td>${fmt(x.third)}</td><td><strong>${fmt(x.personal)}</strong></td><td><span class="pill ${informed?'':'amber'}">${informed?'Valor informado':'Aguardando valor manual'}</span></td></tr>`}).join('')}</tbody></table></div><div class="footnote">Seus gastos pessoais = valor total informado da fatura menos as parcelas de terceiros cadastradas neste mês. Quando não houver valor de fatura informado, o total exibido é apenas uma estimativa baseada nos lançamentos de terceiros, e não o valor real do banco. Recebimentos de terceiros não alteram automaticamente a fatura.</div>${state.cards.some(c=>snapshot(c.id,editingMonth)!=null&&invoice(c.id,editingMonth).personal<0)?'<div class="notice">Atenção: os gastos de terceiros superam o valor informado de uma ou mais faturas. Confira os lançamentos e os valores das faturas.</div>':''}</div><div class="card" style="margin-top:16px"><div class="splithead"><h2 class="sectiontitle">Gastos de terceiros por cartão</h2><span class="pill">${esc(monthLabel(editingMonth))}</span></div>${state.cards.map(c=>{const rows=monthRows(editingMonth,c.id).filter(x=>x.person);return`<div class="statline third-party-card-row"><strong>${esc(c.name)}</strong><span class="third-party-card-summary"><strong>${fmt(sum(rows))}</strong><small>${rows.length} ${rows.length===1?'parcela de terceiro':'parcelas de terceiros'} neste mês</small></span></div>`}).join('')}<div class="footnote">Os valores function previousAdvanceMismatch(id,a,n,start,person){const e=state.entries.find(x=>x.id===id);return !!e&&(e.amount!==a||e.installments!==n||e.start!==start||e.person!==person)}function allocatedInstallments(entryId){return new Set(state.payments.filter(p=>p.entryId===entryId&&Array.isArray(p.installmentNumbers)).flatMap(p=>p.installmentNumbers))}function isInstallmentPaid(entryId,n){return allocatedInstallments(entryId).has(n)}function advanceCount(e){return allocatedInstallments(e.id).size}function advanceValue(e){return advanceCount(e)*e.amount}function safeStateMutation(fn){const old=JSON.stringify(state);fn();if(!save()){state=JSON.parse(old);alert('Não foi possível salvar os dados neste navegador. Nenhuma alteração foi confirmada.');return false}return true}function entriesView(){const rows=monthRows(editingMonth,filterCard).filter(x=>{const q=filter.toLocaleLowerCase('pt-BR').trim();return !q||[x.description,pname(x.person),cname(x.card),fmt(x.amount),String(x.amount/100),x.index+'/'+x.installments].some(v=>String(v).toLocaleLowerCase('pt-BR').includes(q))}).filter(x=>entryStatusFilter==='all'||(entryStatusFilter==='paid'?isInstallmentPaid(x.id,x.index):!isInstallmentPaid(x.id,x.index)));return`<div class="toolbar"><div class="group"><input class="field" id="search" placeholder="Buscar por pessoa, compra, cartão ou valor" value="${esc(filter)}"><select class="field" id="cardfilter"><option value="all">Todos os cartões</option>${state.cards.map(c=>`<option value="${c.id}" ${filterCard===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select class="field" id="statusfilter"><option value="all" ${entryStatusFilter==='all'?'selected':''}>Todas as parcelas</option><option value="paid" ${entryStatusFilter==='paid'?'selected':''}>Quitadas antecipadamente</option><option value="pending" ${entryStatusFilter==='pending'?'selected':''}>Não quitadas antecipadamente</option></select></div><button class="btn" data-action="new">+ Gasto de terceiro</button>< >'}</tbody></table></div><p class="footnote">Pagamentos sem compra vinculada entram no saldo geral da pessoa, mas não são distribuídos automaticamente entre compras.</p><div class="splithead" style="margin-top:24px"><h3 class="sectiontitle">Próximos seis meses</h3></div><div class="detail-months">${months.map(m=>`<div class="detail-month"><small>${esc(monthLabel(m))}</small><strong>${fmt(sum(monthRows(m).filter(e=>e.person===p.id)))}</strong></div>`).join('')}</div><div class="splithead" style="margin-top:24px"><h3 class="sectiontitle">Histórico de recebimentos</h3><button class="btn smallbtn" data-action="payment" data-id="${p.id}">+ Registrar recebimento</button></div>${receiptCards(p.id)}<div class="tablewrap"><table class="table"><thead><tr><th>Mês</th><th>Compra vinculada</th><th>Observação</th><th>Valor</th><th>Ações</th></tr></thead><tbody>${payments.map(x=>`<tr><td>${esc(monthLabel(x.month))}</td><td>${esc(state.entries.find(e=>e.id===x.entryId)?.description||'Saldo geral')}</td><td>${esc(x.note||'Recebimento')}${x.installmentNumbers?.length?'<span class="sub" style="color:#79e0bc">Parcelas antecipadas: '+x.installmentNumbers.join(', ')+'</span>':''}</td><td class="money">${fmt(x.amount)}</td><td><div class="rowactions"><button class="btn secondary smallbtn" data-action="editpayment" data-id="${x.id}">Editar</button><button class="btn danger smallbtn" data-action="deletepayment" data-id="${x.id}">Excluir</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum recebimento.</td></tr>'}</tbody></table></div></div>`}function receiptCards(personId){const payments=state.payments.filter(p=>!personId||p.person===personId).slice().reverse();return `<div class="receipt-list">${payments.map(p=>`<article class="receipt-item"><div class="receipt-item-head"><div><span class="eyebrow">RECEBIMENTO</span><strong>${esc(pname(p.person))}</strong><span class="small">${esc(monthLabel(p.month))} · ${esc(state.entries.find(e=>e.id===p.entryId)?.description||'Saldo geral da pessoa')}</span></div><strong class="receipt-amount">${fmt(p.amount)}</strong></div>${p.note?`<div class="small receipt-note">${esc(p.note)}</div>`:''}<div class="receipt-actions"><button type="button" class="btn secondary smallbtn" data-action="editpayment" data-id="${p.id}">✎ Editar recebimento</button><button type="button" class="btn danger smallbtn" data-action="deletepayment" data-id="${p.id}">Excluir</button></div></article>`).join('')||'<p class="empty">Nenhum recebimento cadastrado.</p>'}</div>`}function peopleView(){const p=state.people.find(x=>x.id===selectedPerson);return`<div class="toolbar"><span class="muted">Histórico individual, compras parceladas e pagamentos parciais</span><div class="group"><button class="btn secondary" data-action="payment">+ Recebimento</button><button class="btn" data-action="person">+ Pessoa</button></div></div>${p?personDetail(p):''}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${state.people.map(p=>{let due=balancePerson(p.id,editingMonth),inst=monthRows(editingMonth).filter(x=>x.person===p.id),got=received(p.id,editingMonth),open=openPerson(p.id);return`<div class="card person-premium"><div class="person"><div class="avatar">${esc(p.name.slice(0,1).toUpperCase())}</div><div><strong>${esc(p.name)}</strong><div class="small">${inst.length} parcelas no mês</div></div></div><div class="cardlabel" style="margin-top:22px">Saldo total em aberto (inclui futuro)</div><div class="metric">${fmt(open)}</div><div class="statline"><span>Parcelas até o mês selecionado, menos recebimentos até então</span><strong>${fmt(due)}</strong></div><div class="statline"><span>Parcelas deste mês</span><strong>${fmt(sum(inst))}</strong></div><div class="statline"><span>Recebido neste mês</span><strong style="color:#73e3bc">${fmt(got)}</strong></div><div class="personactions"><button class="btn" data-action="persondetail" data-id="${p.id}">Ver ficha completa</button><button class="btn secondary" data- onst remainingDays=isFuture?days:isCurrent?days-now.getDate()+1:0;const left=budget.amount-used;const perDay=remainingDays>0?Math.max(0,Math.floor(left/remainingDays)):0;return{budget,used,left,remainingDays,perDay,isCurrent,isFuture,percent:budget.amount?used/budget.amount*100:0}}function personalLimitPanel(){const b=personalBudgetSummary();if(!b)return`<div class="card" style="margin-top:16px"><div class="splithead"><h2 class="sectiontitle">Seu limite de gastos pessoais</h2><button class="btn" data-action="budget">+ Definir limite</button></div><p class="muted">Defina um teto mensal para acompanhar quanto ainda pode gastar. Somente seus gastos entram no cálculo, sem compras de terceiros.</p></div>`;const alert=b.left<0?'Limite ultrapassado':b.left===0?'Limite atingido':b.percent>=90?'Atenção: próximo do limite':b.percent>=80?'Você já utilizou 80% do limite':'Dentro do limite';const alertClass=b.left<=0?'red':b.percent>=80?'amber':'';const subtitle=b.isCurrent?'Estimativa distribuída pelos dias restantes do mês (incluindo hoje).':b.isFuture?'Estimativa para o mês futuro selecionado.':'Mês encerrado: não há saldo diário a gastar neste período.';return`<div class="card" style="margin-top:16px"><div class="splithead"><h2 class="sectiontitle">Seu limite de gastos pessoais</h2><button class="btn secondary smallbtn" data-action="editbudget" data-id="${b.budget.id}">Editar limite</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(165px,1fr))">${metric('Limite mensal',b.budget.amount,'Teto definido por você')}${metric('Gasto pessoal',b.used,'Faturas menos compras de terceiros')}${metric('Quanto falta para o teto',Math.max(0,b.left),b.left<0?'Excedeu em '+fmt(-b.left):'Disponível neste mês')}${metric('Pode gastar por dia',b.perDay,b.remainingDays+' dia(s) restante(s)')}</div><div class="barrow"><span>Utilização do limite</span><strong>${Math.round(b.percent)}%</strong></div><div class="track"><div class="fill ${b.left<=0?'red':b.percent>=80?
